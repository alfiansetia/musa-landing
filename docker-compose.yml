services:
  musa-landing:
    container_name: musa-landing
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-https://musa.kacangan.net}
    image: musa-landing:latest
    # Akses hanya lewat tunnel (app-network) sebagai http://musa-landing:80.
    # Tanpa mapping ports — tidak terekspos via IP:port host.
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/rilis/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  app-network:
    name: app-network
    external: true
