server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # URL lama (zaman satu file release.html) -> arsip baru, permanen
    location = /release.html {
        return 301 /rilis/;
    }

    # version.json dibaca lintas-origin oleh aplikasi (Settings → cek update)
    # dan preview browser — tanpa header ini fetch diblokir CORS.
    location = /version.json {
        add_header Access-Control-Allow-Origin "*" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Keamanan: jangan pernah serve file sensitif/internal, walau file-nya
    # tidak sengaja ikut ke-copy ke image. Balas 404 (bukan 403) supaya
    # tidak mengonfirmasi keberadaan file ke pemindai.
    # 1) Dotfiles (.env, .git/*, dsb) — kecuali .well-known (ACME/security.txt).
    location ^~ /.well-known/ {
        try_files $uri $uri/ =404;
    }
    location ~ /\. {
        return 404;
        access_log off;
        log_not_found off;
    }
    # 2) Nama file sensitif umum (tanpa dot maupun dengan ekstensi backup).
    location ~* /(.env.*|nginx\.conf|Dockerfile.*|docker-compose.*\.ya?ml|\.dockerignore|\.gitignore|README\.md|releases\.json|package(-lock)?\.json|composer\.(json|lock)|.*\.(bak|old|orig|save|swp|dist)|.*~)$ {
        return 404;
        access_log off;
        log_not_found off;
    }

    # File installer namanya berversi (vX.Y.Z di nama file),
    # jadi aman di-cache lama oleh browser/CDN.
    location /downloads/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
