server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # URL lama (zaman satu file release.html) -> arsip baru, permanen
    location = /release.html {
        return 301 /rilis/;
    }

    # version.json dibaca lintas-origin oleh aplikasi (Settings → cek update)
    # dan preview browser — tanpa header ini fetch diblokir CORS.
    location = /version.json {
        add_header Access-Control-Allow-Origin "*" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # File installer namanya berversi (vX.Y.Z di nama file),
    # jadi aman di-cache lama oleh browser/CDN.
    location /downloads/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
